apiVersion: batch/v1
kind: Job
metadata:
  name: cluster-api-client-create
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cluster-api-client
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: client
          image: ghcr.io/mehdichagahi1/cluster-api-client:latest
          imagePullPolicy: IfNotPresent
          args: ["create", "example-group"]
          envFrom:
            - configMapRef:
                name: cluster-api-client-config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
