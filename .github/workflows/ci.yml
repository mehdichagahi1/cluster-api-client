name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python -m pip install --no-build-isolation --no-deps --editable .
      - run: ruff check .
      - run: pytest --cov=cluster_api_client --cov-report=term-missing --cov-fail-under=90
      - run: docker build --tag cluster-api-client:test .
